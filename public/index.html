<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Nex-x Demo Hub</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/assets/theme.js"></script>
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <img src="/favicon.svg" alt="" width="32" height="32">
        <span>Nex-x <small>Demo Hub</small></span>
      </a>
      <label class="search">
        <span class="sr-only">Search demos</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search demos, e.g. POS, gym, CRM…" autocomplete="off">
        <kbd>/</kbd>
      </label>
      <div class="spacer"></div>
      <button id="theme" class="btn btn-icon" type="button" aria-label="Toggle theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h1>Explore our <em>live demos</em></h1>
        <p>Every product Nex-x has built, running live. Preview inside the hub or open in a new tab.</p>
      </div>
      <div class="stats" id="stats"></div>
    </section>

    <div class="toolbar">
      <div class="tabs" id="tabs" role="tablist" aria-label="Categories"></div>
      <div class="seg" role="group" aria-label="Layout">
        <button type="button" data-view="grid" aria-label="Grid view" title="Grid view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
        <button type="button" data-view="list" aria-label="List view" title="List view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
      </div>
    </div>

    <div id="content" aria-live="polite">
      <div class="grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </div>
  </main>

  <footer class="site">© <span id="year"></span> Nex-x · Demo builds are for evaluation only.</footer>

  <div id="preview" class="preview" role="dialog" aria-modal="true" aria-labelledby="pvTitle" hidden>
    <div class="preview-bar">
      <button id="pvClose" class="btn btn-icon" type="button" aria-label="Close preview" title="Close (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="preview-title">
        <b id="pvTitle"></b>
        <a id="pvHost" target="_blank" rel="noopener noreferrer"></a>
      </div>
      <div class="seg preview-devices" role="group" aria-label="Device size">
        <button type="button" data-device="desktop" aria-label="Desktop" title="Desktop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
        <button type="button" data-device="tablet" aria-label="Tablet" title="Tablet"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M11 18h2"/></svg></button>
        <button type="button" data-device="mobile" aria-label="Mobile" title="Mobile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M11 18h2"/></svg></button>
      </div>
      <button id="pvReload" class="btn btn-icon" type="button" aria-label="Reload" title="Reload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/></svg>
      </button>
      <button id="pvCopy" class="btn btn-icon" type="button" aria-label="Copy link" title="Copy link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      </button>
      <a id="pvOpen" class="btn btn-primary" target="_blank" rel="noopener noreferrer">
        Open
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>
      </a>
    </div>
    <div class="preview-stage">
      <div id="frameWrap" class="frame-wrap">
        <div id="frameLoading" class="frame-loading"><div><div class="spinner"></div>Loading demo…</div></div>
        <iframe id="frame" title="Demo preview" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals allow-downloads" referrerpolicy="no-referrer"></iframe>
      </div>
      <div id="frameHint" class="frame-hint" hidden>Page blank? Some demos block embedding — <a id="frameHintLink" target="_blank" rel="noopener noreferrer">open it in a new tab</a>.</div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>
</body>
</html>
